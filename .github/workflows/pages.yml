name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A running deployment is finished before the next one starts (as in GitHub's own template).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Builds Boxedwine and publishes it as a release of this repository, but only if the release for
  # the commit in scripts/build-boxedwine.mjs does not exist yet (otherwise a few seconds).
  boxedwine:
    uses: ./.github/workflows/boxedwine.yml
    permissions:
      contents: write

  build:
    needs: boxedwine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache downloaded runtimes
        uses: actions/cache@v4
        with:
          path: vendor
          key: runtimes-${{ hashFiles('scripts/fetch-runtimes.mjs', 'scripts/build-boxedwine.mjs') }}

      - name: Fetch emulators (Boxedwine, js-dos, latest EmulatorJS), licenses and sources
        run: node scripts/fetch-runtimes.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Separate job: deploy-pages in the same job as the upload sometimes did not find the artifact.
  # GitHub Pages sometimes answers with a short server error (500); then it is tried once more
  # after a minute. If that fails too, "Re-run failed jobs" repeats only this job.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before the second try
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Publish (second try)
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
